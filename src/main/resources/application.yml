spring:
  application:
    name: go-routex-user-service

  threads:
    virtual:
      enabled: true

  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true

    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "vn.com.*"
        
    events:
      ticket-issued: "routex.ticket.issued"

    topics:
      booking: "route.bookings.event"

    group-id:
      membership: "user-service-membership"

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    mapper:
      sort-properties-alphabetically: false

  security:
    user:
      name: ${SPRING_SECURITY_USER_NAME:admin}
      password: ${SPRING_SECURITY_USER_PASSWORD:admin}

  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:6MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:6MB}

management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

server:
  port: ${SERVER_PORT:8081}

client:
  verify:
    url: ${CLIENT_URL:http://localhost:8080/}

identity:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-minutes: 60
    refresh-token-expiration-days: 7
    issuer: ${JWT_ISSUER:user-service}

notification:
  email:
    provider: sendgrid
    sendgrid:
      baseUrl: ${BASE_URL:http://localhost:5173/}
      api-key: ${SENDGRID_API_KEY}
      from-email: ${SENDGRID_FROM_EMAIL:simon@routex-go.com}
      from-name: ${SENDGRID_FROM_NAME:Go-Routex}
      verify-subject: ${SENDGRID_VERIFY_SUBJECT:Registration Form - Verify your Email}

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.transaction: TRACE
    org.hibernate.SQL: DEBUG
    org.springframework.kafka: INFO
    org.apache.kafka: WARN